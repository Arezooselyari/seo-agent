# ---------------------------------------------------------------------------
# پیکربندی چت‌بات — مستقل از config.yaml ریشه‌ی پروژه (همان اصل SaaS-ready:
# هیچ چیز مخصوص «صاحب» نباید هاردکد در کد باشد)
# ---------------------------------------------------------------------------

tenant_id: 1

site_name: "ساغر نظری"
site_url: "https://sagharnazari.ir"
wp_url: "https://sagharnazari.ir"

# مدل‌های Gemini
chat_model: "gemini-2.5-flash"
embedding_model: "models/gemini-embedding-001"
embedding_dim: 768

# شخصیت دستیار — بخش ثابت system prompt (نه کد)
system_persona: |
  تو دستیار هوش مصنوعی فارسی‌زبان سایت «ساغر نظری» هستی. مؤدب، مختصر و
  صمیمی صحبت کن. فقط بر اساس اطلاعاتی که در ادامه به‌عنوان «منابع» به تو
  داده می‌شود پاسخ بده؛ اگر پاسخ را نمی‌دانی صادقانه بگو و پیشنهاد بده
  کاربر درخواست مشاوره ثبت کند. وقتی کاربر علاقه به مشاوره نشان داد، نام
  و شماره تماسش را بپرس و از ابزار ثبت لید استفاده کن.

# RAG
rag_top_k: 5
chunk_max_chars: 1200
chunk_overlap_chars: 150

# حافظه
short_term_turns: 10        # تعداد پیام‌های اخیر که عیناً در context می‌رود
long_term_refresh_every: 6  # هر چند پیام کاربر، خلاصه‌ی بلندمدت آپدیت شود

# ویجت — سایت‌هایی که اجازه‌ی نصب ویجت دارند (site_key از این لیست اعتبارسنجی می‌شود)
widget_sites:
  - key: "sagharnazari"
    origin: "https://sagharnazari.ir"

# رزرو آنلاین با تقویم + ساعت (صفحه‌ی /booking)
booking:
  enabled: true
  slot_minutes: 30          # طول هر نوبت (دقیقه)
  timezone: "Asia/Tehran"
  min_notice_hours: 2       # حداقل فاصله‌ی رزرو تا همین الان (برای امروز)
  # ⚠️ این مقادیر دیگر استفاده نمی‌شوند مگر در حالت اضطراری.
  # ساعت کاری و تعطیلات حالا از پنل CRM تنظیم می‌شوند (crm.sagharnazari.ir)
  # و در دیتابیس ذخیره می‌شوند. اینجا فقط پشتیبانی است برای وقتی که
  # مایگریشن 004_crm.sql هنوز اجرا نشده باشد.
  # برای تغییر ساعت کاری اینجا را دست نزن — از پنل عوضش کن.
  weekly_hours:
    saturday:  { start: "09:00", end: "17:00" }
    sunday:    { start: "09:00", end: "17:00" }
    monday:    { start: "09:00", end: "17:00" }
    tuesday:   { start: "09:00", end: "17:00" }
    wednesday: { start: "09:00", end: "17:00" }
  # روزهای تعطیل خاص (تاریخ میلادی YYYY-MM-DD) — مرخصی، تعطیلات و ...
  blackout_dates: []
